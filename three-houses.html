<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a tale of three houses</title>
    <link rel="stylesheet" href="./stylesheets/three-houses.css">
</head>

<body>

<!-- sticky strip, top -->
    <div class="top-strip">
        <div class="top-strip-content">
        <p> place for hamburger menu & search bar </p>
            <div class="top-strip-logo">
                <a href="./index.html">
                    <p>
                        Causticsalsa
                    </p>
                </a>
                <img src="./images/three-houses/causticsalsa-logo-brown.png" width="45" height="45" alt="logo">
            </div>
        </div>
    </div>

    <div class="content">
        <div class="header"> 
            <div class="header-image">
                <img src="./images/three-houses/header-image-wolf.png" width="150" height="150" alt="wolf gnawing the sun">
            </div>
            <div class="header-text">
                <p>Three Houses. One Hallowed Land.</p>
            </div>

        </div>
        <div class="spread-container">
            <div class="decoration">
                <img src="./images/three-houses/decoration-upward.png" width="200" height="500" alt="rune">
            </div>
            <div class="house-container">
                <div class="house">
                    <div class="house-border">
                        <div class="house-sigil">
                            <img src="./images/three-houses/griffin-sigil.png" width="150" height="188" alt="griffin sigil">
                        </div>
                        <div class="house-name">
                            <p>
                                Abyssos
                            </p>
                        </div>
                    </div>
                </div>
                <div class="house">
                    <div class="house-border">
                        <div class="house-sigil">
                            <img src="./images/three-houses/colt-sigil.png" width="150" height="188" alt="colt sigil">
                        </div>
                        <div class="house-name">
                            <p>
                                Winchester
                            </p>
                        </div>
                    </div>
                </div>
                <div class="house">
                    <div class="house-border">
                        <div class="house-sigil">
                            <img src="./images/three-houses/lion-sigil.png" width="150" height="188" alt="lion sigil">
                        </div>
                        <div class="house-name">
                            <p>
                                Empyrean
                            </p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="decoration">
                <img src="./images/three-houses/decoration-downward.png" width="200" height="500" alt="rune">
            </div>
        </div>

    </div>

    <!-- sticky strip, bottom -->
    <div class="bottom-strip">
        <div class="bottom-strip-text">
        <p>
            bottom strip
        </p>
        </div>
        <div class="bottom-strip-text">
        <p>
            bottom strip
        </p>
        </div>
        <div class="bottom-strip-text">
        <p>
            bottom strip
        </p>
        </div>
    </div>
    
</body>
